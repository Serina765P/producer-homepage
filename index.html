    <style>
        :root {
            --bg: #f5f6fb;
            --aurora-1: rgba(226, 43, 48, 0.20);
            --aurora-2: rgba(39, 67, 210, 0.20);
            --aurora-3: rgba(120, 139, 197, 0.22);
            --aurora-4: rgba(145, 102, 145, 0.18);
        }
        .dark {
            --bg: #070a14;
            --aurora-1: rgba(226, 43, 48, 0.30);
            --aurora-2: rgba(39, 67, 210, 0.34);
            --aurora-3: rgba(120, 139, 197, 0.30);
            --aurora-4: rgba(145, 102, 145, 0.30);
        }
        body { background: var(--bg); }

        /* ---- Aurora drifting background ---- */
        .aurora {
            position: fixed; inset: -20%; z-index: 0; pointer-events: none;
            filter: blur(70px); opacity: 0.9;
        }
        .aurora span {
            position: absolute; display: block; border-radius: 50%;
            mix-blend-mode: normal; will-change: transform;
        }
        .dark .aurora span { mix-blend-mode: screen; }
        .aurora .a1 { width: 46vw; height: 46vw; left: -6vw; top: -8vw;  background: var(--aurora-1); animation: drift1 22s ease-in-out infinite; }
        .aurora .a2 { width: 42vw; height: 42vw; right: -8vw; top: 6vw;  background: var(--aurora-2); animation: drift2 26s ease-in-out infinite; }
        .aurora .a3 { width: 50vw; height: 50vw; left: 20vw; bottom: -18vw; background: var(--aurora-3); animation: drift3 30s ease-in-out infinite; }
        .aurora .a4 { width: 34vw; height: 34vw; right: 12vw; bottom: -6vw; background: var(--aurora-4); animation: drift1 28s ease-in-out infinite reverse; }
        @keyframes drift1 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(6vw,4vw) scale(1.12)} }
        @keyframes drift2 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(-5vw,5vw) scale(1.08)} }
        @keyframes drift3 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(4vw,-6vw) scale(1.15)} }

        /* fine grain texture overlay */
        .grain {
            position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: .04;
            background-image: radial-gradient(rgba(0,0,0,.6) 1px, transparent 1px);
            background-size: 3px 3px;
        }
        .dark .grain { opacity: .05; background-image: radial-gradient(rgba(255,255,255,.7) 1px, transparent 1px); }
        /* ---- Glass surfaces ---- */
        .glass {
            background: rgba(255, 255, 255, 0.62);
            backdrop-filter: blur(18px) saturate(150%);
            -webkit-backdrop-filter: blur(18px) saturate(150%);
            border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 8px 30px -12px rgba(60, 80, 140, 0.18);
        }
        .dark .glass {
            background: rgba(18, 24, 42, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 30px -12px rgba(0, 0, 0, 0.6);
        }

        /* ---- Animated gradient name ---- */
        .gradient-text {
            background: linear-gradient(115deg, #e22b30, #2743d2 30%, #788bc5 55%, #916691 80%, #e22b30);
            background-size: 280% 280%;
            -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent; color: transparent;
            animation: hue 9s ease infinite;
        }
        @keyframes hue { 0%,100%{background-position:0% 50%} 50%{background-position:100% 50%} }

        /* avatar conic ring */
        .avatar-ring { background: conic-gradient(from 0deg, #e22b30, #2743d2, #788bc5, #916691, #5aa39d, #e22b30); }

        /* ---- Cards ---- */
        .tilt { transition: transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s ease; transform-style: preserve-3d; }
        .tilt:hover { box-shadow: 0 22px 50px -20px rgba(40,60,120,.35); }
        .dark .tilt:hover { box-shadow: 0 22px 50px -18px rgba(0,0,0,.7); }
        .idol-mini { transition: transform .3s cubic-bezier(.2,.8,.2,1), box-shadow .3s ease; }
        .idol-mini:hover { transform: translateY(-6px); }
        .idol-mini .ph { transition: transform .45s cubic-bezier(.2,.8,.2,1); }
        .idol-mini:hover .ph { transform: scale(1.08); }

        /* ---- Social ---- */
        .social-btn { transition: transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .25s, color .25s, border-color .25s; }
        .social-btn:hover { transform: translateY(-5px) scale(1.06); }
        .social-btn:focus-visible { outline: 2px solid #2743d2; outline-offset: 3px; }

        /* ---- Lang pills ---- */
        .lang-btn { transition: color .2s; }
        .lang-pill { position: absolute; top: 4px; left: 4px; height: calc(100% - 8px); border-radius: 9999px;
            background: linear-gradient(135deg, #e22b30, #2743d2); transition: transform .3s cubic-bezier(.3,.9,.3,1), width .3s; z-index: 0; }
        .lang-btn.active { color: #fff; }

        /* ---- Toast ---- */
        .toast { opacity: 0; transform: translate(-50%, 24px); transition: opacity .35s, transform .35s cubic-bezier(.2,.9,.2,1); }
        .toast.show { opacity: 1; transform: translate(-50%, 0); }

        /* ---- Scroll reveal ---- */
        .reveal { opacity: 0; transform: translateY(28px); transition: opacity .7s ease, transform .7s cubic-bezier(.2,.8,.2,1); }
        .reveal.in { opacity: 1; transform: none; }

        @media (prefers-reduced-motion: reduce) {
            .aurora span, .avatar-ring, .gradient-text { animation: none !important; }
            .reveal { opacity: 1 !important; transform: none !important; transition: none; }
        }
    </style>
</head>

    <script>
        let currentLang = 'zh';
        let profileData = null, i18nData = null, dataConfig = null;

        const idolColors = {
            haruka: '#e22b30', chihaya: '#2743d2', nao: '#788bc5', reika: '#5aa39d', rinwa: '#916691'
        };
        const gameColors = {
            mltd: { tint: '#d4a008', rgb: '255, 195, 11' },
            scsp: { tint: '#5a9ef0', rgb: '100, 160, 255' }
        };

        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') document.documentElement.classList.add('dark');
            else if (savedTheme === 'light') document.documentElement.classList.remove('dark');
            else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.classList.add('dark');

            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
                if (!localStorage.getItem('theme')) document.documentElement.classList.toggle('dark', e.matches);
            });

            const savedLang = localStorage.getItem('lang');
            if (savedLang) currentLang = savedLang;
            loadData();
        });

        async function loadData() {
            try {
                const [p, i, d] = await Promise.all([
                    fetch('data/profile.json'), fetch('data/i18n.json'), fetch('data/data.json')
                ]);
                profileData = await p.json();
                i18nData = await i.json();
                dataConfig = await d.json();
                initializePage();
            } catch (err) {
                console.error('数据加载失败:', err);
            }
        }
        function initializePage() {
            const avatarImg = document.getElementById('avatar-image');
            if (avatarImg) { avatarImg.src = profileData.avatar; avatarImg.alt = profileData.name; }
            const navAvatar = document.getElementById('nav-avatar');
            if (navAvatar) navAvatar.src = profileData.avatar;

            loadIdolCards();
            loadGameIds();
            loadFooter();
            setSocialLinks();
            setLanguage(currentLang);
            initReveal();
        }

        function getIdolName(idol, lang) {
            return lang === 'zh' ? idol.nameZh : lang === 'ja' ? idol.nameJa : idol.nameEn;
        }

        function loadIdolCards() {
            const featured = document.getElementById('featured-idol-container');
            const grid = document.getElementById('idol-grid-container');
            featured.innerHTML = ''; grid.innerHTML = '';

            const featuredIdol = profileData.idols.find(i => i.id === 'nao');
            const others = profileData.idols.filter(i => i.id !== 'nao');

            if (featuredIdol) {
                const c = idolColors[featuredIdol.color] || '#788bc5';
                const card = document.createElement('div');
                card.className = 'group glass tilt rounded-3xl p-5 sm:p-7 relative overflow-hidden';
                card.style.setProperty('--c', c);
                card.innerHTML = `
                    <span class="absolute inset-x-0 top-0 h-1.5" style="background:linear-gradient(90deg, transparent, ${c}, transparent)"></span>
                    <span class="absolute -right-12 -bottom-12 w-48 h-48 rounded-full blur-3xl opacity-30 group-hover:opacity-50 transition-opacity" style="background:${c}" aria-hidden="true"></span>
                    <div class="relative flex flex-col sm:flex-row items-center sm:items-center gap-5 sm:gap-7">
                        <div class="relative flex-shrink-0">
                            <span class="absolute -inset-1 rounded-3xl blur-md opacity-40" style="background:${c}" aria-hidden="true"></span>
                            <div class="relative w-28 h-28 sm:w-36 sm:h-36 rounded-3xl overflow-hidden ring-2" style="--tw-ring-color:${c}66">
                                <img src="${featuredIdol.image}" alt="${featuredIdol.nameZh}" class="w-full h-full object-cover">
                            </div>
                        </div>
                        <div class="flex-1 text-center sm:text-left">
                            <span class="inline-flex items-center gap-1.5 rounded-full px-3 py-1 text-xs font-bold mb-2.5" style="background:${c}1f;color:${c}">
                                <i class="${featuredIdol.icon} text-[10px]"></i><span data-i18n="featured_label">${i18nData[currentLang].featured_label}</span>
                            </span>
                            <h3 class="font-display font-extrabold text-3xl sm:text-4xl tracking-tight" data-idol-name="${featuredIdol.id}">${getIdolName(featuredIdol, currentLang)}</h3>
                            <p class="text-sm sm:text-base font-medium text-slate-500 dark:text-slate-400 mt-1.5 tracking-wide">${featuredIdol.series}</p>
                        </div>
                    </div>`;
                featured.appendChild(card);
            }

            others.forEach(idol => {
                const c = idolColors[idol.color] || '#788bc5';
                const card = document.createElement('div');
                card.className = 'idol-mini group glass rounded-3xl p-4 text-center relative overflow-hidden';
                card.innerHTML = `
                    <span class="absolute inset-x-6 top-0 h-1 rounded-b" style="background:${c}" aria-hidden="true"></span>
                    <div class="relative w-20 h-20 mx-auto mb-3 rounded-2xl overflow-hidden ring-2" style="--tw-ring-color:${c}55">
                        <img src="${idol.image}" alt="${idol.nameZh}" class="ph w-full h-full object-cover">
                    </div>
                    <div class="flex items-center justify-center gap-1.5 mb-0.5">
                        <i class="${idol.icon} text-xs" style="color:${c}"></i>
                        <h3 class="font-display font-bold text-sm" data-idol-name="${idol.id}">${getIdolName(idol, currentLang)}</h3>
                    </div>
                    <p class="text-[11px] font-medium text-slate-500 dark:text-slate-400 tracking-wide">${idol.series}</p>`;
                grid.appendChild(card);
            });
        }
        function loadGameIds() {
            const container = document.getElementById('game-ids-container');
            container.innerHTML = '';

            Object.entries(dataConfig.gameIds).forEach(([key, game]) => {
                const col = gameColors[key] || gameColors.mltd;
                const name = i18nData[currentLang][`game_${key}_name`];

                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'group relative overflow-hidden rounded-2xl p-4 text-left transition-all';
                btn.style.background = `rgba(${col.rgb}, 0.10)`;
                btn.style.border = `1px solid rgba(${col.rgb}, 0.28)`;
                btn.onmouseenter = () => { btn.style.background = `rgba(${col.rgb}, 0.18)`; btn.style.transform = 'translateY(-3px)'; };
                btn.onmouseleave = () => { btn.style.background = `rgba(${col.rgb}, 0.10)`; btn.style.transform = 'none'; };
                btn.onclick = () => copyToClipboard(game.id);

                btn.innerHTML = `
                    <span class="absolute -right-8 -top-8 w-28 h-28 rounded-full blur-2xl opacity-50 group-hover:opacity-80 transition-opacity" style="background:rgba(${col.rgb},0.35)" aria-hidden="true"></span>
                    <div class="relative flex items-center justify-between gap-3">
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center gap-2 mb-1.5">
                                <span class="text-xs font-bold truncate" style="color:${col.tint}">${name}</span>
                                <i class="fas fa-copy text-xs opacity-0 group-hover:opacity-100 transition-opacity" style="color:${col.tint}"></i>
                            </div>
                            <p class="text-xl font-mono font-bold tracking-wide text-slate-800 dark:text-slate-100">${game.id}</p>
                            <p class="text-[11px] text-slate-500 dark:text-slate-400 mt-0.5" data-i18n="click_copy">${i18nData[currentLang].click_copy}</p>
                        </div>
                        <div class="w-16 h-16 rounded-xl overflow-hidden flex-shrink-0 ring-2" style="--tw-ring-color:rgba(${col.rgb},0.45)">
                            <img src="${game.icon}" alt="${name}" class="w-full h-full object-cover">
                        </div>
                    </div>`;
                container.appendChild(btn);
            });
        }

        function loadFooter() {
            const footerText = document.getElementById('footer-text');
            if (footerText) footerText.innerHTML = i18nData[currentLang].footer_text;

            const badges = document.getElementById('footer-badges');
            badges.innerHTML = profileData.footerBadges.map(b =>
                `<span style="color:${b.color}" class="font-semibold whitespace-nowrap">${b.name}</span>`
            ).join('<span class="text-slate-300 dark:text-slate-700">·</span>');
        }

        function setSocialLinks() {
            const btns = document.querySelectorAll('.social-btn');
            const links = [
                { href: dataConfig.socialLinks.twitter, label: 'Twitter / X' },
                { href: dataConfig.socialLinks.youtube, label: 'YouTube' },
                { href: dataConfig.socialLinks.bilibili, label: 'Bilibili' },
                { href: dataConfig.socialLinks.github, label: 'GitHub' },
                { href: `tencent://message/?uin=${dataConfig.socialLinks.qq}`, label: 'QQ' },
                { href: dataConfig.socialLinks.steam, label: 'Steam' },
                { href: dataConfig.socialLinks.blog, label: '博客' },
            ];
            btns.forEach((btn, i) => {
                if (!links[i]) return;
                btn.href = links[i].href;
                btn.setAttribute('aria-label', links[i].label);
                if (!['QQ', '博客'].includes(links[i].label)) {
                    btn.setAttribute('target', '_blank');
                    btn.setAttribute('rel', 'noopener noreferrer');
                }
            });
        }
        function setLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('lang', lang);
            document.documentElement.lang = lang === 'zh' ? 'zh-CN' : lang === 'ja' ? 'ja' : 'en';

            const titles = { zh: '芹菜P | SerinaP', ja: 'セリナＰ | SerinaP', en: 'SerinaP | 芹菜P' };
            document.title = titles[lang] || document.title;

            const nameDisplay = document.getElementById('name-display');
            if (nameDisplay) nameDisplay.textContent = i18nData[lang].name;
            const navName = document.querySelector('nav [data-i18n="name"]');
            if (navName) navName.textContent = i18nData[lang].name;

            loadIdolCards();

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (i18nData[lang] && i18nData[lang][key]) el.textContent = i18nData[lang][key];
            });

            const wikiTitle = document.getElementById('wiki-title');
            const wikiDesc = document.getElementById('wiki-desc');
            if (wikiTitle && i18nData[lang]) {
                const span = wikiTitle.querySelector('span');
                if (span) span.textContent = i18nData[lang].wiki_title;
                if (wikiDesc) wikiDesc.textContent = i18nData[lang].wiki_desc;
            }

            loadGameIds();
            loadFooter();
            updateLangButtons();
        }

        function updateLangButtons() {
            const btns = document.querySelectorAll('.lang-btn');
            const pill = document.getElementById('lang-pill');
            let active = null;
            btns.forEach(btn => {
                const on = btn.getAttribute('data-lang') === currentLang;
                btn.classList.toggle('active', on);
                if (on) active = btn;
            });
            if (pill && active) {
                pill.style.width = active.offsetWidth + 'px';
                pill.style.transform = `translateX(${active.offsetLeft - 4}px)`;
            }
        }

        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => showToast(i18nData[currentLang].copied))
                .catch(() => showToast(i18nData[currentLang].copied));
        }

        let toastTimer = null;
        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').textContent = message;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), 2400);
        }

        function initReveal() {
            const items = document.querySelectorAll('.reveal');
            if (!('IntersectionObserver' in window)) { items.forEach(el => el.classList.add('in')); return; }
            const io = new IntersectionObserver((entries) => {
                entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
            }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });
            items.forEach(el => io.observe(el));
        }

        window.addEventListener('resize', updateLangButtons);
    </script>
    </main>
</body>
</html>
